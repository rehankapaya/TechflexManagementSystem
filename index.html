<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TechFlex Management System</title>
    <meta name="description" content="TechFlex Institute & Academy Management System" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechFlex" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/jpeg" href="/official-logo.jpg" />
    <link rel="apple-touch-icon" href="/official-logo.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-500/20 selection:text-blue-700">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for PWA Offline & App Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('TechFlex PWA ServiceWorker registered with scope:', registration.scope);
            },
            (error) => {
              console.log('TechFlex PWA ServiceWorker registration failed:', error);
            }
          );
        });
      }
    </script>
  </body>
</html>
