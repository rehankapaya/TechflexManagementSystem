<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Accent badge -->
  <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#blueGrad)" filter="url(#shadow)"/>
  
  <!-- Graduation Cap Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 116)">
    <!-- Cap Board -->
    <polygon points="150,40 280,105 150,170 20,105" fill="#FFFFFF" fill-opacity="0.2" />
    <!-- Cap Base -->
    <path d="M60,130 L60,195 C60,240 240,240 240,195 L240,130" />
    <!-- Tassel -->
    <path d="M255,118 L255,210" />
    <circle cx="255" cy="220" r="10" fill="#FFFFFF" />
  </g>
</svg>

